spring.application.name=ACollaborativeTask-TrackingSystem

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/task_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=TestRoot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File upload storage directory (created on first upload)
app.upload.dir=C:/uploads

# JWT configuration
app.jwt.secret=change-me-to-a-long-random-base64-secret-key-at-least-32-bytes-long
app.jwt.expiration-ms=86400000